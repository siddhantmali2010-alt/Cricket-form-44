
<!DOCTYPE html>
<html>
<head>
    <title>Cricket Player Registration</title>
</head>
<body>

<h2>Cricket Player Registration Form</h2>

<form id="playerForm">

    <label>Player Name:</label><br>
    <input type="text" id="name" required>
    <br><br>

    <label>Team Name:</label><br>
    <input type="text" id="team" required>
    <br><br>

    <label>Jersey Number:</label><br>
    <input type="number" id="jersey" required>
    <br><br>

    <button type="submit">Submit</button>

</form>

<p id="message"></p>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbzzWHaNkLjBOFI2qX6MYtu5ocYsHMCutGfHYlSt7LO-CaDx9M-Cel73XJz975MrSEd3/exec";

document.getElementById("playerForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    const data = {
        name: document.getElementById("name").value,
        team: document.getElementById("team").value,
        jersey: document.getElementById("jersey").value
    };

    document.getElementById("message").innerText =
    "Submitting...";

    fetch(scriptURL, {
        method: "POST",
        mode: "no-cors",
        body: new URLSearchParams(data)
    });

    document.getElementById("message").innerText =
    "Submission sent! Check Google Sheet.";

    document.getElementById("playerForm").reset();

});
</script>

</body>
</html>
