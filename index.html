
<!DOCTYPE html>
<html>
<head>
<title>Player Registration</title>
</head>
<body>

<h2>Player Registration Form</h2>

<form id="playerForm">

<label>Player Name</label>
<input type="text" id="playerName" required>
<br><br>

<label>Team Name</label>
<input type="text" id="teamName" required>
<br><br>

<label>Jersey Number</label>
<input type="number" id="jersey" required>
<br><br>

<button type="submit">Submit</button>

</form>

<p id="result"></p>

<script>
document.getElementById("playerForm")
.addEventListener("submit", function(e) {

e.preventDefault();

let data = {
name: document.getElementById("playerName").value,
team: document.getElementById("teamName").value,
jersey: document.getElementById("jersey").value
};

fetch("https://script.google.com/macros/s/AKfycbz99LIZQkgYlOMkYjLkDbg4Pu1t_jOOLS86BwGLi5ooeZjnPIArf8RYf1Qm2rxBSsnP/exec", {
method: "POST",
mode: "no-cors",
body: JSON.stringify(data)
});

document.getElementById("result").innerHTML =
"Details Submitted Successfully!";

document.getElementById("playerForm").reset();

});
</script>

</body>
</html>
